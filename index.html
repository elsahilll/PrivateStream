<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Video Stream</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Key Prompt Screen -->
    <div id="lock-screen">
        <div class="login-box">
            <h2>Private Video Stream</h2>
            <p>Paste the Decryption Key provided to you to unlock and play this video.</p>

            <input type="text" id="key-input" placeholder="e.g. mN8q7Z0yH_AbCdEfGh1234" autocomplete="off" autofocus>

            <button id="unlock-btn">Unlock & Stream</button>
            <div id="error-text" class="error-msg">Please enter a valid decryption key.</div>
        </div>
    </div>

    <header>
        <h1>Personal Stream</h1>
        <p>Private streaming player</p>
    </header>

    <div class="stream-layout">

        <!-- Player Column -->
        <div class="player-card">
            <div class="video-wrapper">
                <!-- Starts blank until user inputs the decryption key -->
                <iframe id="active-player" src="" allowfullscreen>
                </iframe>
            </div>
        </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
